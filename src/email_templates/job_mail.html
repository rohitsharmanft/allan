<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>New %JOB_TYPE% Posted</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family: Arial, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            width="500"
            cellpadding="0"
            cellspacing="0"
            style="background: #ffffff; padding: 25px; border-radius: 6px"
          >
            <tr>
              <td
                style="
                  font-size: 18px;
                  font-weight: bold;
                  padding: 15px;
                  text-align: center;
                  background-color: #2563eb;
                  color: #ffffff;
                  border-radius: 6px 6px 0 0;
                "
              >
                New %JOB_TYPE% Posted
              </td>
            </tr>

            <tr>
              <td style="font-size: 14px; color: #333; line-height: 1.6">
                <p>Hello Admin,</p>

                <p>A new %JOB_TITLE% has been posted:</p>

                <p><strong>Posted By:</strong> %CLIENT_NAME%</p>
                <p><strong>Type:</strong> %JOB_TYPE%</p>
                <!-- <p><strong>Category:</strong> %CATEGORY%</p>
                <p><strong>Skills Required:</strong> %SKILLS%</p> -->
                <p><strong>Location:</strong> %CITY%, %LOCATION%</p>
                <p><strong>Start Date:</strong> %START_DATE%</p>
                <p><strong>Closing Date:</strong> %CLOSE_DATE%</p>
                <!-- %IF_FILE%
                <p>
                  <strong>Attached File:</strong><br />
                  <a
                    href="%UPLOAD_FILE%"
                    style="color: #2563eb; text-decoration: none"
                    >View Attachment</a
                  >
                </p>
                %END_IF_FILE%

                <p>
                  You can view the job details using the link below:<br />
                  <a href="%JOB_LINK%" style="color: #2563eb"
                    >View Job Details</a
                  >
                </p> -->

                <p>Thank you,</p>
              </td>
            </tr>
            <tr>
              <td
                style="
                  font-size: 12px;
                  color: #888;
                  padding-top: 20px;
                  text-align: center;
                "
              >
                © 2026 SkillsTrad. All rights reserved.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
